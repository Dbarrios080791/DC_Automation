# Se ejecuta en cada commit (make setup instala el hook) y en CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt

  - repo: local
    hooks:
      - id: nac-validate-nxos
        name: nac-validate (NX-OS)
        entry: nac-validate -r nac/nxos/rules nac/nxos/data
        language: system
        files: ^nac/nxos/(data|rules)/
        pass_filenames: false
      - id: nac-validate-aci
        name: nac-validate (ACI)
        entry: nac-validate nac/aci/data
        language: system
        files: ^nac/aci/data/
        pass_filenames: false
      - id: ansible-lint
        name: ansible-lint
        entry: bash -c 'cd ansible && ansible-lint playbooks/'
        language: system
        files: ^ansible/
        pass_filenames: false
