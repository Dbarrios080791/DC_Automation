# =============================================================================
# Plantilla de lab de CLASE: 2 spines + 2 leafs N9Kv + 2 hosts = 6 nodos.
# Los switches arrancan SOLO con gestión: todo lo demás lo configuras tú.
# Rango de gestión de labs de clase: 192.168.100.101-119 (uno activo a la vez).
# Ajusta nodos/enlaces en la GUI de CML y re-exporta este YAML si la clase lo pide.
# =============================================================================
lab:
  title: __LAB_NAME__
  description: Lab de clase DCExperts (configuración manual).
  notes: |
    Lab de estudio: se configura A MANO siguiendo la clase.
    Guarda tus configs finales en configs/ al terminar.
  version: 0.2.2
nodes:
- id: n0
  label: mgmt-bridge
  node_definition: external_connector
  x: -400
  y: -350
  configuration: bridge0
  tags: []
  interfaces:
  - id: i0
    label: port
    slot: 0
    type: physical
- id: n1
  label: oob-switch
  node_definition: unmanaged_switch
  x: -400
  y: -200
  tags: []
  interfaces:
  - id: i0
    label: port0
    slot: 0
    type: physical
  - id: i1
    label: port1
    slot: 1
    type: physical
  - id: i2
    label: port2
    slot: 2
    type: physical
  - id: i3
    label: port3
    slot: 3
    type: physical
  - id: i4
    label: port4
    slot: 4
    type: physical
  - id: i5
    label: port5
    slot: 5
    type: physical
- id: n2
  label: spine1
  node_definition: nxosv9000
  x: -150
  y: -200
  configuration: |
    hostname spine1
    no password strength-check
    username admin password __ADMIN_PASSWORD__ role network-admin
    feature lldp
    vrf context management
      ip route 0.0.0.0/0 192.168.100.1
    interface mgmt0
      vrf member management
      ip address 192.168.100.101/24
      no shutdown
  ram: 8192
  cpus: 2
  tags: []
  interfaces:
  - id: i0
    label: mgmt0
    slot: 0
    type: physical
  - id: i1
    label: Ethernet1/1
    slot: 1
    type: physical
  - id: i2
