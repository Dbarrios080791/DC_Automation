- id: n2
  label: spine1
  node_definition: nxosv9000
  x: -150
  y: -200
  configuration: |
    hostname spine1
    no password strength-check
    username admin password __ADMIN_PASSWORD__ role network-admin
    feature nxapi
    feature lldp
    vrf context management
      ip route 0.0.0.0/0 192.168.100.1
    interface mgmt0
      vrf member management
      ip address 192.168.100.11/24
      no shutdown
  tags: []
  interfaces:
  - id: i0
    label: mgmt0
    slot: 0
    type: physical
  - id: i1
