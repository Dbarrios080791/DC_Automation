# =============================================================================
# Topología CML - fabric de AUTOMATIZACIÓN (NaC). 5x N9Kv + 3x Alpine = 8 nodos
# Generada para CML 2.7+. Los placeholders __ADMIN_PASSWORD__ los reemplaza
# Terraform (cml/) con TF_VAR_device_password: no importes este YAML a mano.
# =============================================================================
lab:
  title: nac-nxos-fabric
  description: Fabric VXLAN EVPN gestionado 100% con Network as Code (Terraform nac-nxos).
  notes: |
    NO configurar a mano. Toda la configuración se aplica desde nac/nxos/data.
    Levantar con: make lab-up LAB=nac/nxos/cml
  version: 0.2.2
nodes:
- id: n0
  label: mgmt-bridge
  node_definition: external_connector
  x: -400
  y: -350
  configuration: bridge0
  tags: []
  interfaces:
  - id: i0
    label: port
    slot: 0
    type: physical
- id: n1
  label: oob-switch
  node_definition: unmanaged_switch
  x: -400
  y: -200
  tags: []
  interfaces:
  - id: i0
    label: port0
    slot: 0
    type: physical
  - id: i1
