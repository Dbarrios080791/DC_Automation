---
nxos:
  devices:
    - name: leaf1
      url: https://192.168.100.21
      device_groups: [leafs]
      variables:
        loopback0: 10.0.0.11
        loopback1: 10.0.1.11
      configuration:
        system:
          hostname: leaf1
        interfaces:
          ethernets:
            - id: "1/1"
              description: to spine1 Eth1/1
              mtu: 9216
              shutdown: false
              switchport:
                enabled: false
              ip:
                address: 10.1.1.1/31
              ospf:
                process: UNDERLAY
                area: 0.0.0.0
                network: point-to-point
            - id: "1/2"
              description: to spine2 Eth1/1
              mtu: 9216
              shutdown: false
              switchport:
                enabled: false
              ip:
                address: 10.1.2.1/31
              ospf:
                process: UNDERLAY
                area: 0.0.0.0
                network: point-to-point
            - id: "1/5"
              description: host1 (VLAN 10)
              shutdown: false
              switchport:
                mode: access
                access_vlan: 10
