---
nxos:
  devices:
    - name: spine2
      url: https://192.168.100.12
      device_groups: [spines]
      variables:
        loopback0: 10.0.0.2
      configuration:
        system:
          hostname: spine2
        interfaces:
          ethernets:
            - id: "1/1"
              description: to leaf1 Eth1/2
              mtu: 9216
              shutdown: false
              switchport:
                enabled: false
              ip:
                address: 10.1.2.0/31
              ospf:
                process: UNDERLAY
                area: 0.0.0.0
                network: point-to-point
            - id: "1/2"
              description: to leaf2 Eth1/2
              mtu: 9216
              shutdown: false
              switchport:
                enabled: false
              ip:
                address: 10.1.2.2/31
              ospf:
                process: UNDERLAY
                area: 0.0.0.0
                network: point-to-point
            - id: "1/3"
              description: to leaf3 Eth1/2
              mtu: 9216
              shutdown: false
              switchport:
                enabled: false
              ip:
                address: 10.1.2.4/31
              ospf:
                process: UNDERLAY
                area: 0.0.0.0
                network: point-to-point
