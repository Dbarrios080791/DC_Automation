---
nxos:
  devices:
    - name: leaf2
      url: https://192.168.100.22
      device_groups: [leafs]
      variables:
        loopback0: 10.0.0.12
        loopback1: 10.0.1.12
      configuration:
        system:
          hostname: leaf2
        interfaces:
          ethernets:
            - id: "1/1"
              description: to spine1 Eth1/2
              mtu: 9216
              shutdown: false
              switchport:
                enabled: false
              ip:
                address: 10.1.1.3/31
              ospf:
                process: UNDERLAY
                area: 0.0.0.0
                network: point-to-point
            - id: "1/2"
              description: to spine2 Eth1/2
              mtu: 9216
              shutdown: false
              switchport:
                enabled: false
              ip:
                address: 10.1.2.3/31
              ospf:
                process: UNDERLAY
                area: 0.0.0.0
                network: point-to-point
            - id: "1/5"
              description: host2 (VLAN 10)
              shutdown: false
              switchport:
                mode: access
                access_vlan: 10
